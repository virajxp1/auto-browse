[project]
name = "auto-browse-mvp"
version = "0.1.0"
description = "Constrained browser agent MVP using Playwright + OpenRouter."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
  "autoevals>=0.1.0",
  "braintrust>=0.9.0",
  "deepagents>=0.4.11",
  "fastapi>=0.116.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "markdownify>=0.14.1",
  "playwright==1.58.0",
  "pydantic>=2.7.0",
  "readability-lxml>=0.8.4.1",
  "uvicorn>=0.30.0",
  "scrapegraphai>=1.13.0",
  "rebrowser-playwright>=1.52.0",
  "instructor>=1.15.1",
  "crawl4ai>=0.8.6",
  "camoufox>=0.4.11",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "auto_browse*", "auto_browse_v2*"]

[tool.setuptools.package-data]
agent = ["*.ini"]
